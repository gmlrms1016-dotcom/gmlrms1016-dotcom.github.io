<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Water waves background -->
  <path d="M4 62 Q14 56 24 62 Q34 68 44 62 Q54 56 64 62 Q70 66 76 62 L76 76 L4 76 Z" fill="#e5e5ea"/>
  <path d="M4 66 Q14 60 24 66 Q34 72 44 66 Q54 60 64 66 Q70 70 76 66 L76 78 L4 78 Z" fill="#d1d1d6"/>
  <!-- Life ring outer circle -->
  <circle cx="40" cy="34" r="26" fill="#1d1d1f"/>
  <!-- Life ring inner hole -->
  <circle cx="40" cy="34" r="16" fill="#f5f5f7"/>
  <!-- Life ring segments (cross pattern = 4 alternating black/white) -->
  <!-- Top segment white fill -->
  <path d="M40 8 A26 26 0 0 1 66 34 L52 34 A12 12 0 0 0 40 22 Z" fill="white" opacity="0.85"/>
  <!-- Right segment dark -->
  <path d="M66 34 A26 26 0 0 1 40 60 L40 48 A12 12 0 0 0 52 34 Z" fill="#3a3a3c"/>
  <!-- Bottom segment white -->
  <path d="M40 60 A26 26 0 0 1 14 34 L28 34 A12 12 0 0 0 40 48 Z" fill="white" opacity="0.85"/>
  <!-- Left segment dark -->
  <path d="M14 34 A26 26 0 0 1 40 8 L40 22 A12 12 0 0 0 28 34 Z" fill="#3a3a3c"/>
  <!-- Center hole -->
  <circle cx="40" cy="34" r="14" fill="#f5f5f7"/>
  <!-- Rope around ring -->
  <circle cx="40" cy="34" r="26" fill="none" stroke="#6e6e73" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Center cross/target -->
  <line x1="40" y1="26" x2="40" y2="42" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="48" y2="34" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="40" cy="34" r="3" fill="none" stroke="#aeaeb2" stroke-width="1.5"/>
</svg>