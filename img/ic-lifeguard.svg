<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="ringGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#C0392B"/>
    </radialGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/></filter>
  </defs>
  <!-- Water -->
  <path d="M4 62 Q14 56 24 62 Q34 68 44 62 Q54 56 64 62 Q70 66 76 62 L76 78 L4 78 Z" fill="url(#waterGrad)" opacity="0.85"/>
  <path d="M4 68 Q14 63 24 68 Q34 73 44 68 Q54 63 64 68 Q70 71 76 68 L76 78 L4 78 Z" fill="#0071e3" opacity="0.5"/>
  <!-- Foam highlights -->
  <path d="M4 62 Q14 56 24 62" fill="none" stroke="white" stroke-width="1.2" opacity="0.5"/>
  <path d="M34 68 Q44 62 54 68" fill="none" stroke="white" stroke-width="1.2" opacity="0.5"/>
  <!-- Ring outer -->
  <circle cx="40" cy="32" r="26" fill="url(#ringGrad)" filter="url(#s)"/>
  <!-- Ring inner hole -->
  <circle cx="40" cy="32" r="15" fill="#f0f0f5"/>
  <!-- White segments (top & bottom) -->
  <path d="M40 6 A26 26 0 0 1 66 32 L51 32 A11 11 0 0 0 40 21 Z" fill="white"/>
  <path d="M40 58 A26 26 0 0 1 14 32 L29 32 A11 11 0 0 0 40 43 Z" fill="white"/>
  <!-- Red segments restored -->
  <path d="M66 32 A26 26 0 0 1 40 58 L40 43 A11 11 0 0 0 51 32 Z" fill="#C0392B"/>
  <path d="M14 32 A26 26 0 0 1 40 6  L40 21 A11 11 0 0 0 29 32 Z" fill="#C0392B"/>
  <!-- Center hole (sky blue) -->
  <circle cx="40" cy="32" r="13" fill="#e8f4fd"/>
  <!-- Rope -->
  <circle cx="40" cy="32" r="26" fill="none" stroke="#f0c040" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
  <!-- Center crosshair -->
  <line x1="40" y1="25" x2="40" y2="39" stroke="#0071e3" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="33" y1="32" x2="47" y2="32" stroke="#0071e3" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="40" cy="32" r="3.5" fill="none" stroke="#0071e3" stroke-width="1.5"/>
  <!-- Shine on ring -->
  <path d="M22 14 Q28 10 36 9 A26 26 0 0 0 22 22 Z" fill="white" opacity="0.2"/>
</svg>