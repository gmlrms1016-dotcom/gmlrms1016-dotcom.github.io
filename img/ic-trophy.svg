<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="40%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#CC8400"/>
    </linearGradient>
    <linearGradient id="cupHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE55A"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#5C4500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#CC8400" flood-opacity="0.4"/></filter>
  </defs>
  <!-- Shadow -->
  <ellipse cx="40" cy="77" rx="18" ry="3" fill="#996600" opacity="0.25"/>
  <!-- Base plate -->
  <rect x="22" y="68" width="36" height="8" rx="4" fill="url(#baseGrad)"/>
  <rect x="24" y="69" width="32" height="3" rx="1.5" fill="#c9a227" opacity="0.4"/>
  <!-- Stem -->
  <rect x="34" y="58" width="12" height="12" rx="2" fill="url(#baseGrad)"/>
  <rect x="36" y="58" width="4" height="12" fill="#c9a227" opacity="0.3"/>
  <!-- Left handle -->
  <path d="M18 26 Q6 26 6 38 Q6 50 18 50" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M18 30 Q10 30 10 38 Q10 46 18 46" fill="none" stroke="#FFE55A" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Right handle -->
  <path d="M62 26 Q74 26 74 38 Q74 50 62 50" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M62 30 Q70 30 70 38 Q70 46 62 46" fill="none" stroke="#FFE55A" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Cup body -->
  <path d="M18 12 L62 12 L58 58 L22 58 Z" fill="url(#goldGrad)" filter="url(#s)"/>
  <!-- Cup rim -->
  <rect x="18" y="12" width="44" height="7" rx="3.5" fill="#FFE55A"/>
  <!-- Left highlight stripe -->
  <path d="M24 20 L28 56 L25 56 L21 20 Z" fill="white" opacity="0.2"/>
  <!-- Inner curve shadow -->
  <path d="M22 18 Q40 52 58 18" fill="none" stroke="#CC8400" stroke-width="2" opacity="0.5"/>
  <!-- Star (gold, glowing) -->
  <path d="M40 22 L42.8 31 L52 31 L44.6 36.4 L47.4 45.4 L40 40 L32.6 45.4 L35.4 36.4 L28 31 L37.2 31 Z"
        fill="#FFD700" filter="url(#glow)"/>
  <!-- Star inner bright -->
  <path d="M40 26 L41.6 31 L46.5 31 L42.5 33.8 L44 38.5 L40 35.8 L36 38.5 L37.5 33.8 L33.5 31 L38.4 31 Z"
        fill="#FFFDE0" opacity="0.7"/>
  <!-- Engraving line -->
  <line x1="28" y1="48" x2="52" y2="48" stroke="#CC8400" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <line x1="30" y1="51" x2="50" y2="51" stroke="#CC8400" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
</svg>