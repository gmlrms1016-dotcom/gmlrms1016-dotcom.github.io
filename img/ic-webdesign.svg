<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Monitor stand -->
  <rect x="33" y="60" width="14" height="6" rx="2" fill="#3a3a3c"/>
  <rect x="26" y="65" width="28" height="4" rx="2" fill="#1d1d1f"/>
  <!-- Monitor body -->
  <rect x="8" y="14" width="64" height="46" rx="6" fill="#1d1d1f"/>
  <!-- Screen -->
  <rect x="13" y="19" width="54" height="36" rx="3" fill="#f5f5f7"/>
  <!-- Screen content: browser chrome -->
  <rect x="13" y="19" width="54" height="7" rx="3" fill="#e5e5ea"/>
  <rect x="13" y="23" width="54" height="3" fill="#e5e5ea"/>
  <!-- Browser buttons -->
  <circle cx="19" cy="22.5" r="2" fill="#aeaeb2"/>
  <circle cx="25" cy="22.5" r="2" fill="#aeaeb2"/>
  <circle cx="31" cy="22.5" r="2" fill="#aeaeb2"/>
  <!-- URL bar -->
  <rect x="36" y="20" width="26" height="5" rx="2.5" fill="white"/>
  <!-- Web layout on screen -->
  <rect x="16" y="30" width="24" height="14" rx="2" fill="#d1d1d6"/>
  <rect x="16" y="30" width="24" height="6" rx="2" fill="#aeaeb2"/>
  <rect x="16" y="46" width="24" height="2" rx="1" fill="#d1d1d6"/>
  <rect x="16" y="50" width="16" height="2" rx="1" fill="#d1d1d6"/>
  <!-- Color palette swatch -->
  <rect x="44" y="30" width="20" height="20" rx="3" fill="white" stroke="#e5e5ea" stroke-width="1"/>
  <circle cx="49" cy="35" r="3" fill="#1d1d1f"/>
  <circle cx="57" cy="35" r="3" fill="#6e6e73"/>
  <circle cx="49" cy="44" r="3" fill="#aeaeb2"/>
  <circle cx="57" cy="44" r="3" fill="#d1d1d6"/>
  <!-- Paint brush -->
  <line x1="58" y1="12" x2="74" y2="8" stroke="#3a3a3c" stroke-width="3" stroke-linecap="round"/>
  <path d="M52 18 L58 12 L62 16 L56 22 Z" fill="#1d1d1f"/>
  <path d="M47 22 Q50 19 52 18 L56 22 Q53 25 50 26 Z" fill="#6e6e73"/>
</svg>