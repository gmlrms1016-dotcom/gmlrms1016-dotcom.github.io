<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="monGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2d40"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.25"/></filter>
  </defs>
  <!-- Stand -->
  <rect x="33" y="60" width="14" height="7" rx="2" fill="#34495e"/>
  <rect x="24" y="66" width="32" height="5" rx="2.5" fill="#2c3e50"/>
  <!-- Monitor body -->
  <rect x="6" y="12" width="68" height="50" rx="7" fill="url(#monGrad)" filter="url(#s)"/>
  <!-- Screen -->
  <rect x="11" y="17" width="58" height="40" rx="4" fill="url(#screenGrad)"/>
  <!-- Browser bar -->
  <rect x="11" y="17" width="58" height="9" rx="4" fill="#243447"/>
  <rect x="11" y="22" width="58" height="4" fill="#243447"/>
  <!-- Traffic lights -->
  <circle cx="17" cy="21.5" r="2.2" fill="#ff5f56"/>
  <circle cx="23" cy="21.5" r="2.2" fill="#ffbd2e"/>
  <circle cx="29" cy="21.5" r="2.2" fill="#27c93f"/>
  <!-- URL bar -->
  <rect x="34" y="19" width="28" height="5" rx="2.5" fill="#1a2d40"/>
  <!-- Code lines on screen -->
  <rect x="15" y="30" width="12" height="2.5" rx="1" fill="#e06c75"/>
  <rect x="29" y="30" width="18" height="2.5" rx="1" fill="#98c379"/>
  <rect x="15" y="35" width="8"  height="2.5" rx="1" fill="#61afef"/>
  <rect x="25" y="35" width="22" height="2.5" rx="1" fill="#c678dd"/>
  <rect x="15" y="40" width="15" height="2.5" rx="1" fill="#e5c07b"/>
  <rect x="32" y="40" width="10" height="2.5" rx="1" fill="#98c379"/>
  <rect x="15" y="45" width="10" height="2.5" rx="1" fill="#61afef"/>
  <rect x="27" y="45" width="20" height="2.5" rx="1" fill="#e06c75"/>
  <rect x="15" y="50" width="18" height="2.5" rx="1" fill="#c678dd"/>
  <!-- Colour palette -->
  <rect x="51" y="29" width="15" height="26" rx="3" fill="#1a2d40" stroke="#2d4a6b" stroke-width="1"/>
  <circle cx="57" cy="35" r="3.5" fill="#e06c75"/>
  <circle cx="63" cy="35" r="3.5" fill="#e5c07b"/>
  <circle cx="57" cy="43" r="3.5" fill="#98c379"/>
  <circle cx="63" cy="43" r="3.5" fill="#61afef"/>
  <circle cx="57" cy="51" r="3.5" fill="#c678dd"/>
  <circle cx="63" cy="51" r="3.5" fill="#56b6c2"/>
  <!-- Paintbrush -->
  <line x1="57" y1="10" x2="74" y2="5" stroke="#8B6914" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M51 16 L57 10 L61 14 L55 20 Z" fill="#c9a227"/>
  <path d="M46 21 Q49 18 51 16 L55 20 Q52 23 49 25 Z" fill="#61afef"/>
  <circle cx="47" cy="22" r="2" fill="#5AC8FA" opacity="0.7"/>
