<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- Background -->
  <rect width="400" height="200" fill="#f5f5f7"/>
  <!-- Laptop base shadow -->
  <ellipse cx="200" cy="185" rx="130" ry="8" fill="#1d1d1f" opacity="0.1"/>
  <!-- Laptop base/keyboard -->
  <rect x="60" y="156" width="280" height="20" rx="4" fill="#d1d1d6"/>
  <rect x="60" y="156" width="280" height="6" rx="4" fill="#c0c0c8"/>
  <!-- Keyboard keys suggestion -->
  <rect x="80" y="162" width="240" height="8" rx="2" fill="#e5e5ea" opacity="0.6"/>
  <!-- Hinge -->
  <rect x="60" y="152" width="280" height="6" rx="2" fill="#aeaeb2"/>
  <!-- Trackpad -->
  <rect x="166" y="162" width="68" height="10" rx="3" fill="#e5e5ea"/>

  <!-- Laptop screen bezel -->
  <rect x="70" y="22" width="260" height="132" rx="10" fill="#1d1d1f"/>
  <!-- Screen -->
  <rect x="80" y="32" width="240" height="112" rx="4" fill="#111113"/>

  <!-- Code editor: tab bar -->
  <rect x="80" y="32" width="240" height="16" rx="4" fill="#1a1a1c"/>
  <rect x="80" y="40" width="240" height="8" fill="#1a1a1c"/>
  <!-- Tabs -->
  <rect x="86" y="34" width="54" height="12" rx="3" fill="#2d2d30"/>
  <rect x="144" y="34" width="46" height="12" rx="3" fill="#1a1a1c"/>
  <rect x="194" y="34" width="46" height="12" rx="3" fill="#1a1a1c"/>
  <!-- Tab text lines -->
  <line x1="94" y1="40" x2="112" y2="40" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="150" y1="40" x2="164" y2="40" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/>
  <line x1="200" y1="40" x2="214" y2="40" stroke="#6e6e73" stroke-width="1" stroke-linecap="round"/>
  <!-- Close dot on tab -->
  <circle cx="130" cy="40" r="2.5" fill="#3a3a3c"/>

  <!-- Line numbers sidebar -->
  <rect x="80" y="48" width="18" height="96" fill="#171719"/>
  <line x1="84" y1="56" x2="92" y2="56" stroke="#3a3a3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="84" y1="64" x2="93" y2="64" stroke="#3a3a3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="84" y1="72" x2="91" y2="72" stroke="#3a3a3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="84" y1="80" x2="93" y2="80" stroke="#3a3a3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="84" y1="88" x2="92" y2="88" stroke="#3a3a3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="84" y1="96" x2="93" y2="96" stroke="#3a3a3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="84" y1="104" x2="91" y2="104" stroke="#3a3a3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="84" y1="112" x2="92" y2="112" stroke="#3a3a3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="84" y1="120" x2="93" y2="120" stroke="#3a3a3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="84" y1="128" x2="91" y2="128" stroke="#3a3a3c" stroke-width="1" stroke-linecap="round"/>
  <line x1="84" y1="136" x2="92" y2="136" stroke="#3a3a3c" stroke-width="1" stroke-linecap="round"/>

  <!-- Code lines (HTML/CSS style) -->
  <!-- Line 1: tag -->
  <line x1="104" y1="56" x2="116" y2="56" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="118" y1="56" x2="148" y2="56" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="150" y1="56" x2="160" y2="56" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Line 2: indent -->
  <line x1="112" y1="64" x2="128" y2="64" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="130" y1="64" x2="170" y2="64" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="172" y1="64" x2="200" y2="64" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Line 3: highlighted (selected) -->
  <rect x="98" y="68" width="160" height="10" rx="1" fill="#2d2d30"/>
  <line x1="112" y1="73" x2="132" y2="73" stroke="#d1d1d6" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="134" y1="73" x2="158" y2="73" stroke="#aeaeb2" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="160" y1="73" x2="188" y2="73" stroke="#d1d1d6" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Line 4 -->
  <line x1="104" y1="82" x2="130" y2="82" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="132" y1="82" x2="155" y2="82" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Line 5 indent -->
  <line x1="112" y1="90" x2="140" y2="90" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="142" y1="90" x2="165" y2="90" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="167" y1="90" x2="190" y2="90" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Line 6 -->
  <line x1="112" y1="98" x2="128" y2="98" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="130" y1="98" x2="160" y2="98" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Line 7 closing -->
  <line x1="104" y1="106" x2="118" y2="106" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Line 8 -->
  <line x1="112" y1="114" x2="145" y2="114" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="147" y1="114" x2="172" y2="114" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cursor blink -->
  <rect x="149" y="120" width="2" height="10" rx="1" fill="#aeaeb2" opacity="0.9"/>
  <!-- Line 9 -->
  <line x1="104" y1="130" x2="126" y2="130" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="128" y1="130" x2="152" y2="130" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Line 10 -->
  <line x1="104" y1="138" x2="122" y2="138" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right panel: preview -->
  <rect x="230" y="48" width="90" height="96" fill="#1a1a1c"/>
  <line x1="228" y1="48" x2="228" y2="144" stroke="#2d2d30" stroke-width="1.5"/>
  <!-- Preview nav bar -->
  <rect x="230" y="48" width="90" height="10" fill="#252527"/>
  <circle cx="237" cy="53" r="2" fill="#3a3a3c"/>
  <circle cx="244" cy="53" r="2" fill="#3a3a3c"/>
  <circle cx="251" cy="53" r="2" fill="#3a3a3c"/>
  <!-- Preview content: hero text -->
  <rect x="238" y="64" width="50" height="5" rx="2" fill="#3a3a3c"/>
  <rect x="238" y="72" width="38" height="4" rx="1.5" fill="#252527"/>
  <!-- Preview nav items -->
  <rect x="238" y="82" width="16" height="3" rx="1.5" fill="#252527"/>
  <rect x="258" y="82" width="16" height="3" rx="1.5" fill="#252527"/>
  <rect x="278" y="82" width="14" height="3" rx="1.5" fill="#252527"/>
  <!-- Preview cards -->
  <rect x="238" y="92" width="26" height="20" rx="3" fill="#252527"/>
  <rect x="268" y="92" width="26" height="20" rx="3" fill="#252527"/>
  <rect x="238" y="106" width="56" height="3" rx="1" fill="#2d2d30"/>
  <rect x="238" y="116" width="50" height="3" rx="1" fill="#2d2d30"/>
  <rect x="238" y="128" width="20" height="8" rx="4" fill="#3a3a3c"/>

  <!-- Webcam dot -->
  <circle cx="200" cy="26" r="2.5" fill="#2a2a2c"/>
  <circle cx="200" cy="26" r="1.2" fill="#3a3a3c"/>

  <!-- Label -->
  <text x="200" y="192" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#6e6e73" text-anchor="middle" letter-spacing="3">PORTFOLIO WEBSITE</text>
</svg>