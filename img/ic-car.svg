<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Road -->
  <rect x="0" y="60" width="80" height="20" rx="0" fill="#e5e5ea"/>
  <line x1="8" y1="70" x2="20" y2="70" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8,6"/>
  <line x1="34" y1="70" x2="46" y2="70" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8,6"/>
  <line x1="60" y1="70" x2="72" y2="70" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8,6"/>
  <!-- Car body shadow -->
  <ellipse cx="40" cy="63" rx="30" ry="4" fill="#1d1d1f" opacity="0.15"/>
  <!-- Car body lower -->
  <rect x="8" y="46" width="64" height="18" rx="5" fill="#1d1d1f"/>
  <!-- Car roof -->
  <path d="M20 46 Q24 28 32 26 L48 26 Q56 28 60 46 Z" fill="#1d1d1f"/>
  <!-- Windshield front -->
  <path d="M48 30 Q55 32 58 46 L44 46 Z" fill="#6e6e73" opacity="0.5"/>
  <!-- Windshield rear -->
  <path d="M32 30 Q25 32 22 46 L36 46 Z" fill="#6e6e73" opacity="0.5"/>
  <!-- Car windows side -->
  <rect x="33" y="30" width="14" height="14" rx="2" fill="#6e6e73" opacity="0.6"/>
  <!-- Door line -->
  <line x1="40" y1="46" x2="40" y2="63" stroke="#3a3a3c" stroke-width="1.2"/>
  <!-- Door handle -->
  <rect x="42" y="53" width="6" height="2" rx="1" fill="#6e6e73"/>
  <rect x="32" y="53" width="6" height="2" rx="1" fill="#6e6e73"/>
  <!-- Front wheel -->
  <circle cx="56" cy="62" r="9" fill="#3a3a3c"/>
  <circle cx="56" cy="62" r="6" fill="#6e6e73"/>
  <circle cx="56" cy="62" r="3" fill="#1d1d1f"/>
  <circle cx="56" cy="62" r="1.5" fill="#aeaeb2"/>
  <!-- Rear wheel -->
  <circle cx="24" cy="62" r="9" fill="#3a3a3c"/>
  <circle cx="24" cy="62" r="6" fill="#6e6e73"/>
  <circle cx="24" cy="62" r="3" fill="#1d1d1f"/>
  <circle cx="24" cy="62" r="1.5" fill="#aeaeb2"/>
  <!-- Headlight -->
  <rect x="66" y="50" width="6" height="5" rx="2" fill="#d1d1d6"/>
  <!-- Taillight -->
  <rect x="8" y="50" width="6" height="5" rx="2" fill="#aeaeb2"/>
</svg>