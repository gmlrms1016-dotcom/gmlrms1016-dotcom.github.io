  <circle cx="38" cy="30" r="4" fill="#6e6e73"/>
  <path d="M34 30 L30 42" stroke="#6e6e73" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M42 30 L50 36" stroke="#6e6e73" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Headlight -->
  <ellipse cx="67" cy="50" rx="4" ry="3" fill="#d1d1d6"/>
  <!-- Exhaust -->
  <path d="M20 58 L10 60 Q6 62 8 65" fill="none" stroke="#6e6e73" stroke-width="2" stroke-linecap="round"/>
