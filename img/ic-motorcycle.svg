  <circle cx="18" cy="58" r="14" fill="#1d1d1f"/>
  <circle cx="18" cy="58" r="9" fill="#3a3a3c"/>
  <circle cx="18" cy="58" r="4" fill="#1d1d1f"/>
  <circle cx="18" cy="58" r="2" fill="#aeaeb2"/>
  <!-- Spokes -->
  <line x1="18" y1="49" x2="18" y2="67" stroke="#6e6e73" stroke-width="1"/>
  <line x1="9" y1="58" x2="27" y2="58" stroke="#6e6e73" stroke-width="1"/>
  <line x1="11.5" y1="51.5" x2="24.5" y2="64.5" stroke="#6e6e73" stroke-width="1"/>
  <line x1="24.5" y1="51.5" x2="11.5" y2="64.5" stroke="#6e6e73" stroke-width="1"/>
  <!-- Front wheel -->
  <circle cx="62" cy="58" r="14" fill="#1d1d1f"/>
  <circle cx="62" cy="58" r="9" fill="#3a3a3c"/>
  <circle cx="62" cy="58" r="4" fill="#1d1d1f"/>
  <circle cx="62" cy="58" r="2" fill="#aeaeb2"/>
  <!-- Spokes -->
  <line x1="62" y1="49" x2="62" y2="67" stroke="#6e6e73" stroke-width="1"/>
  <line x1="53" y1="58" x2="71" y2="58" stroke="#6e6e73" stroke-width="1"/>
  <line x1="55.5" y1="51.5" x2="68.5" y2="64.5" stroke="#6e6e73" stroke-width="1"/>
  <line x1="68.5" y1="51.5" x2="55.5" y2="64.5" stroke="#6e6e73" stroke-width="1"/>
  <!-- Frame/chassis -->
  <path d="M18 58 L28 42 L40 38 L54 44 L62 58" fill="none" stroke="#1d1d1f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Engine block -->
  <rect x="28" y="46" width="18" height="12" rx="3" fill="#3a3a3c"/>
