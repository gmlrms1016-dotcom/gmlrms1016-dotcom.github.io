<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="starGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Outer sparkle rays -->
  <line x1="40" y1="4"  x2="40" y2="14" stroke="#FF9500" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="66" x2="40" y2="76" stroke="#FF9500" stroke-width="3" stroke-linecap="round"/>
  <line x1="4"  y1="40" x2="14" y2="40" stroke="#FF9500" stroke-width="3" stroke-linecap="round"/>
  <line x1="66" y1="40" x2="76" y2="40" stroke="#FF9500" stroke-width="3" stroke-linecap="round"/>
  <line x1="12" y1="12" x2="19" y2="19" stroke="#AF52DE" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="61" y1="61" x2="68" y2="68" stroke="#AF52DE" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="12" x2="61" y2="19" stroke="#FF2D55" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="68" x2="19" y2="61" stroke="#FF2D55" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 8-point star -->
  <path d="M40 10 L44 30 L62 24 L50 38 L68 48 L48 49 L48 68 L40 54 L32 68 L32 49 L12 48 L30 38 L18 24 L36 30 Z" fill="url(#starGrad)" filter="url(#glow)"/>
  <!-- Inner star highlight -->
  <path d="M40 18 L43 30 L53 27 L46 36 L56 42 L45 43 L45 55 L40 47 L35 55 L35 43 L24 42 L34 36 L27 27 L37 30 Z" fill="#FFE55A" opacity="0.6"/>
  <!-- Center -->
  <circle cx="40" cy="40" r="10" fill="#FF9500"/>
  <circle cx="40" cy="40" r="6"  fill="#FFD60A"/>
  <circle cx="40" cy="40" r="3"  fill="#FFFDE0"/>
  <!-- Small accent stars -->
  <circle cx="20" cy="18" r="3"  fill="#AF52DE" opacity="0.9"/>
  <circle cx="60" cy="14" r="2"  fill="#FF2D55" opacity="0.9"/>
  <circle cx="14" cy="55" r="2.5" fill="#5AC8FA" opacity="0.9"/>
  <circle cx="64" cy="58" r="3"  fill="#34C759" opacity="0.9"/>
</svg>
