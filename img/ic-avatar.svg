<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="#1d1d1f"/>
  <!-- Body / torso -->
  <path d="M14 80 Q14 58 28 54 Q34 52 40 52 Q46 52 52 54 Q66 58 66 80 Z" fill="#3a3a3c"/>
  <!-- Shirt collar -->
  <path d="M34 54 L40 62 L46 54 Q40 58 34 54 Z" fill="#252527"/>
  <!-- Neck -->
  <rect x="36" y="44" width="8" height="10" rx="3" fill="#4a4a4f"/>
  <!-- Head -->
  <circle cx="40" cy="34" r="16" fill="#4a4a4f"/>
  <!-- Face highlight -->
  <circle cx="40" cy="34" r="16" fill="none" stroke="#5a5a5f" stroke-width="0.5"/>
  <!-- Hair -->
  <path d="M24 30 Q24 16 40 16 Q56 16 56 30 Q54 20 40 20 Q26 20 24 30 Z" fill="#2a2a2c"/>
  <!-- Ears -->
  <circle cx="24" cy="34" r="4" fill="#4a4a4f"/>
  <circle cx="24" cy="34" r="2" fill="#3a3a3c"/>
  <circle cx="56" cy="34" r="4" fill="#4a4a4f"/>
  <circle cx="56" cy="34" r="2" fill="#3a3a3c"/>
  <!-- Eyes -->
  <circle cx="33" cy="32" r="4" fill="#1d1d1f"/>
  <circle cx="47" cy="32" r="4" fill="#1d1d1f"/>
  <circle cx="33" cy="32" r="2.5" fill="#2a2a2c"/>
  <circle cx="47" cy="32" r="2.5" fill="#2a2a2c"/>
  <!-- Eye gleam -->
  <circle cx="34.5" cy="30.5" r="1.2" fill="white" opacity="0.8"/>
  <circle cx="48.5" cy="30.5" r="1.2" fill="white" opacity="0.8"/>
  <!-- Nose -->
  <path d="M38 36 Q40 40 42 36" fill="none" stroke="#3a3a3c" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M33 42 Q40 47 47 42" fill="none" stroke="#3a3a3c" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Glasses (developer look) -->
  <rect x="28" y="28" width="10" height="8" rx="3" fill="none" stroke="#6e6e73" stroke-width="1.5"/>
  <rect x="42" y="28" width="10" height="8" rx="3" fill="none" stroke="#6e6e73" stroke-width="1.5"/>
  <line x1="38" y1="32" x2="42" y2="32" stroke="#6e6e73" stroke-width="1.5"/>
  <line x1="22" y1="30" x2="28" y2="31" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="31" x2="58" y2="30" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
</svg>