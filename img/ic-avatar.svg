<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#003fa3"/>
    </radialGradient>
    <radialGradient id="skinGrad" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFDAB9"/>
      <stop offset="100%" stop-color="#E8A87C"/>
    </radialGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#004fb8"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/></filter>
  </defs>

  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="url(#bgGrad)"/>
  <!-- Subtle inner highlight -->
  <circle cx="40" cy="40" r="38" fill="none" stroke="white" stroke-width="0.5" opacity="0.15"/>

  <!-- Body / shirt -->
  <path d="M10 80 Q12 56 28 52 Q34 50 40 50 Q46 50 52 52 Q68 56 70 80 Z"
        fill="url(#shirtGrad)"/>
  <!-- Shirt collar (V-neck) -->
  <path d="M34 52 L40 60 L46 52 Q40 56 34 52 Z" fill="#FFDAB9"/>
  <!-- Shirt highlight -->
  <path d="M14 80 Q15 65 22 58 L28 52 Q18 60 16 80 Z" fill="white" opacity="0.08"/>

  <!-- Neck -->
  <rect x="36" y="43" width="8" height="10" rx="3" fill="#E8A87C"/>

  <!-- Head -->
  <ellipse cx="40" cy="33" rx="16" ry="17" fill="url(#skinGrad)" filter="url(#s)"/>

  <!-- Hair -->
  <path d="M24 28 Q23 14 40 14 Q57 14 56 28 Q53 18 40 18 Q27 18 24 28 Z" fill="#2c1810"/>
  <!-- Side hair -->
  <path d="M24 28 Q22 33 23 38 Q22 33 24 26 Z" fill="#2c1810"/>
  <path d="M56 28 Q58 33 57 38 Q58 33 56 26 Z" fill="#2c1810"/>

  <!-- Ears -->
  <ellipse cx="24" cy="34" rx="4" ry="5" fill="#E8A87C"/>
  <ellipse cx="24" cy="34" rx="2.2" ry="3" fill="#D4907A"/>
  <ellipse cx="56" cy="34" rx="4" ry="5" fill="#E8A87C"/>
  <ellipse cx="56" cy="34" rx="2.2" ry="3" fill="#D4907A"/>

  <!-- Eyebrows -->
  <path d="M30 28 Q33 26 36 27" fill="none" stroke="#2c1810" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M44 27 Q47 26 50 28" fill="none" stroke="#2c1810" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="33" cy="32" rx="4.5" ry="4" fill="white"/>
  <ellipse cx="47" cy="32" rx="4.5" ry="4" fill="white"/>
  <!-- Iris -->
  <circle cx="33" cy="33" r="2.8" fill="#4a2c0a"/>
  <circle cx="47" cy="33" r="2.8" fill="#4a2c0a"/>
  <!-- Pupil -->
  <circle cx="33" cy="33" r="1.5" fill="#1a0a00"/>
  <circle cx="47" cy="33" r="1.5" fill="#1a0a00"/>
  <!-- Eye gleam -->
  <circle cx="34.5" cy="31.5" r="1.1" fill="white" opacity="0.85"/>
  <circle cx="48.5" cy="31.5" r="1.1" fill="white" opacity="0.85"/>

  <!-- Nose -->
  <path d="M38 37 Q40 41 42 37" fill="none" stroke="#C47A5A" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="40" cy="39" r="1" fill="#D4907A" opacity="0.5"/>

  <!-- Smile -->
  <path d="M33 43 Q40 49 47 43" fill="none" stroke="#C47A5A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Glasses (dev style) -->
  <rect x="28" y="29" width="10" height="7" rx="3" fill="none" stroke="#2c2c2c" stroke-width="1.5"/>
  <rect x="42" y="29" width="10" height="7" rx="3" fill="none" stroke="#2c2c2c" stroke-width="1.5"/>
  <line x1="38" y1="32.5" x2="42" y2="32.5" stroke="#2c2c2c" stroke-width="1.5"/>
  <line x1="22" y1="30" x2="28" y2="31" stroke="#2c2c2c" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="31" x2="58" y2="30" stroke="#2c2c2c" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Lens tint -->
  <rect x="28.5" y="29.5" width="9" height="6" rx="2.5" fill="#5AC8FA" opacity="0.15"/>
  <rect x="42.5" y="29.5" width="9" height="6" rx="2.5" fill="#5AC8FA" opacity="0.15"/>
</svg>
