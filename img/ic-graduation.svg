<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Board shadow -->
  <ellipse cx="40" cy="35" rx="28" ry="4" fill="#1d1d1f" opacity="0.08" transform="translate(0 4)"/>
  <!-- Mortarboard top diamond shape -->
  <polygon points="40,9 74,27 40,38 6,27" fill="#1d1d1f"/>
  <!-- Cap top highlight edge -->
  <polygon points="40,9 74,27 40,38 6,27" fill="none" stroke="white" stroke-width="0.5" opacity="0.15"/>
  <!-- Center dot on top -->
  <circle cx="40" cy="23" r="2.5" fill="white" opacity="0.25"/>
  <!-- Hanging cord and tassel -->
  <line x1="66" y1="27" x2="66" y2="42" stroke="#6e6e73" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tassel top -->
  <circle cx="66" cy="42" r="3.5" fill="#6e6e73"/>
  <!-- Tassel strands -->
  <line x1="63" y1="45" x2="61" y2="54" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="66" y1="46" x2="65" y2="55" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="69" y1="45" x2="71" y2="54" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Diploma scroll body -->
  <rect x="18" y="50" width="44" height="24" rx="5" fill="#f5f5f7"/>
  <rect x="18" y="50" width="44" height="24" rx="5" fill="none" stroke="#d1d1d6" stroke-width="1.2"/>
  <!-- Ribbon stripe on diploma -->
  <rect x="34" y="50" width="12" height="24" rx="0" fill="#e5e5ea" opacity="0.6"/>
  <!-- Seal circle on diploma -->
  <circle cx="55" cy="62" r="6" fill="none" stroke="#aeaeb2" stroke-width="1.2"/>
  <circle cx="55" cy="62" r="3" fill="#d1d1d6"/>
  <!-- Text lines on diploma -->
  <line x1="24" y1="59" x2="32" y2="59" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="63" x2="32" y2="63" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="67" x2="30" y2="67" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round"/>
</svg>