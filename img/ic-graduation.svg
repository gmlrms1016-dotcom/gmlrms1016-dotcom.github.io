<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#0d2347"/>
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9e7"/>
      <stop offset="100%" stop-color="#fdeaa8"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.2"/></filter>
  </defs>
  <!-- Diploma scroll -->
  <rect x="16" y="50" width="48" height="26" rx="5" fill="url(#scrollGrad)" filter="url(#s)"/>
  <rect x="16" y="50" width="48" height="26" rx="5" fill="none" stroke="#f0c040" stroke-width="1.2"/>
  <rect x="32" y="50" width="16" height="26" fill="#fde68a" opacity="0.5"/>
  <circle cx="56" cy="63" r="7" fill="none" stroke="#f0c040" stroke-width="1.2"/>
  <circle cx="56" cy="63" r="4" fill="#f6d860"/>
  <line x1="22" y1="59" x2="30" y2="59" stroke="#c9a227" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="63" x2="30" y2="63" stroke="#c9a227" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="67" x2="28" y2="67" stroke="#c9a227" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Cap -->
  <polygon points="40,9 76,27 40,40 4,27" fill="url(#capGrad)" filter="url(#s)"/>
  <polygon points="40,9 76,27 40,40 4,27" fill="none" stroke="#2a4d8f" stroke-width="0.8" opacity="0.4"/>
  <!-- Cap highlight -->
  <path d="M40 9 L76 27 L58 33 L40 14 Z" fill="white" opacity="0.06"/>
  <!-- Tassel cord -->
  <line x1="68" y1="27" x2="68" y2="44" stroke="#f6d860" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="68" cy="44" r="4" fill="#f6d860"/>
  <!-- Tassel strands -->
  <line x1="65" y1="48" x2="62" y2="57" stroke="#f0c040" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="68" y1="48" x2="67" y2="58" stroke="#f0c040" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="71" y1="48" x2="74" y2="57" stroke="#f0c040" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Star on cap -->
  <polygon points="40,18 41.5,23 47,23 42.5,26 44,31 40,28 36,31 37.5,26 33,23 38.5,23" fill="#f6d860" opacity="0.5"/>
</svg>
