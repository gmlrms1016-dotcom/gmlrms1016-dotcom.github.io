<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.35"/></filter>
  </defs>
  <!-- Body shadow -->
  <rect x="17" y="12" width="48" height="66" rx="11" fill="#000" opacity="0.2" transform="translate(1 3)"/>
  <!-- Phone body (space gray) -->
  <rect x="16" y="9" width="48" height="66" rx="11" fill="url(#bodyGrad)" filter="url(#s)"/>
  <!-- Frame highlight -->
  <rect x="16" y="9" width="48" height="66" rx="11" fill="none" stroke="#5a5a5e" stroke-width="1"/>
  <!-- Side buttons (right - power) -->
  <rect x="64" y="24" width="3" height="11" rx="1.5" fill="#4a4a4e"/>
  <!-- Side buttons (left - volume + silent) -->
  <rect x="13" y="21" width="3" height="8" rx="1.5" fill="#4a4a4e"/>
  <rect x="13" y="32" width="3" height="13" rx="1.5" fill="#4a4a4e"/>
  <rect x="13" y="48" width="3" height="13" rx="1.5" fill="#4a4a4e"/>
  <!-- Screen -->
  <rect x="21" y="17" width="38" height="54" rx="7" fill="url(#screenGrad)"/>
  <!-- Wallpaper gradient on screen -->
  <rect x="21" y="17" width="38" height="54" rx="7" fill="url(#screenGrad)"/>
  <rect x="21" y="17" width="38" height="27" rx="7" fill="#0071e3" opacity="0.15"/>
  <!-- Dynamic island -->
  <rect x="31" y="20" width="18" height="7" rx="3.5" fill="#0a0a0c"/>
  <!-- Camera in island -->
  <circle cx="44" cy="23.5" r="2" fill="#1a1a1c"/>
  <circle cx="44" cy="23.5" r="1" fill="#2a2a2e"/>
  <!-- App icons (colorful) -->
  <!-- Row 1 -->
  <rect x="24" y="31" width="9" height="9" rx="2.2" fill="#0071e3"/>
  <rect x="35" y="31" width="9" height="9" rx="2.2" fill="#34C759"/>
  <rect x="46" y="31" width="9" height="9" rx="2.2" fill="#FF9500"/>
  <!-- Row 2 -->
  <rect x="24" y="43" width="9" height="9" rx="2.2" fill="#FF2D55"/>
  <rect x="35" y="43" width="9" height="9" rx="2.2" fill="#AF52DE"/>
  <rect x="46" y="43" width="9" height="9" rx="2.2" fill="#5AC8FA"/>
  <!-- Row 3 -->
  <rect x="24" y="55" width="9" height="9" rx="2.2" fill="#FF9500"/>
  <rect x="35" y="55" width="9" height="9" rx="2.2" fill="#0071e3"/>
  <rect x="46" y="55" width="9" height="9" rx="2.2" fill="#34C759"/>
  <!-- App icon details (white shapes inside) -->
  <rect x="26" y="33" width="5" height="1.5" rx="0.7" fill="white" opacity="0.6"/>
  <rect x="26" y="35.5" width="5" height="1.5" rx="0.7" fill="white" opacity="0.6"/>
  <!-- Home indicator -->
  <rect x="32" y="66" width="16" height="3" rx="1.5" fill="#6e6e73"/>
  <!-- Screen shine -->
  <path d="M23 19 Q28 17 34 17 L23 30 Z" fill="white" opacity="0.05"/>
</svg>