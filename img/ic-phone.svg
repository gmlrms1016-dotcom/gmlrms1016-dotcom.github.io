<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Phone body shadow -->
  <rect x="16" y="9" width="48" height="66" rx="10" fill="#1d1d1f" opacity="0.1" transform="translate(1 3)"/>
  <!-- Phone body -->
  <rect x="16" y="9" width="48" height="66" rx="10" fill="#1d1d1f"/>
  <!-- Phone side buttons -->
  <rect x="64" y="25" width="3" height="10" rx="1.5" fill="#3a3a3c"/>
  <rect x="13" y="22" width="3" height="7" rx="1.5" fill="#3a3a3c"/>
  <rect x="13" y="32" width="3" height="12" rx="1.5" fill="#3a3a3c"/>
  <!-- Screen -->
  <rect x="21" y="18" width="38" height="52" rx="6" fill="#f5f5f7"/>
  <!-- Dynamic island -->
  <rect x="31" y="21" width="18" height="6" rx="3" fill="#1d1d1f"/>
  <circle cx="40" cy="24" r="2" fill="#252527"/>
  <!-- App grid on screen -->
  <rect x="25" y="32" width="10" height="10" rx="2.5" fill="#e5e5ea"/>
  <rect x="39" y="32" width="10" height="10" rx="2.5" fill="#d1d1d6"/>
  <rect x="25" y="46" width="10" height="10" rx="2.5" fill="#d1d1d6"/>
  <rect x="39" y="46" width="10" height="10" rx="2.5" fill="#e5e5ea"/>
  <!-- Phone call icon in center -->
  <circle cx="40" cy="40" r="7" fill="#1d1d1f" opacity="0.06"/>
  <!-- Home indicator -->
  <rect x="32" y="65" width="16" height="3" rx="1.5" fill="#aeaeb2"/>
</svg>