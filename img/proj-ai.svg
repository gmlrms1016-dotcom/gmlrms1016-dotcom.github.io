<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- Background -->
  <rect width="400" height="200" fill="#2a2a2c"/>
  <!-- Grid lines (circuit board feel) -->
  <line x1="0" y1="50" x2="400" y2="50" stroke="#333336" stroke-width="1"/>
  <line x1="0" y1="100" x2="400" y2="100" stroke="#333336" stroke-width="1"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#333336" stroke-width="1"/>
  <line x1="80" y1="0" x2="80" y2="200" stroke="#333336" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="200" stroke="#333336" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="200" stroke="#333336" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="200" stroke="#333336" stroke-width="1"/>

  <!-- Neural network nodes (background) -->
  <!-- Left layer -->
  <circle cx="40" cy="50" r="5" fill="none" stroke="#4a4a4f" stroke-width="1.5"/>
  <circle cx="40" cy="100" r="5" fill="none" stroke="#4a4a4f" stroke-width="1.5"/>
  <circle cx="40" cy="150" r="5" fill="none" stroke="#4a4a4f" stroke-width="1.5"/>
  <!-- Connections left-mid -->
  <line x1="45" y1="50" x2="115" y2="70" stroke="#3a3a3e" stroke-width="1"/>
  <line x1="45" y1="50" x2="115" y2="100" stroke="#3a3a3e" stroke-width="1"/>
  <line x1="45" y1="100" x2="115" y2="70" stroke="#3a3a3e" stroke-width="1"/>
  <line x1="45" y1="100" x2="115" y2="130" stroke="#3a3a3e" stroke-width="1"/>
  <line x1="45" y1="150" x2="115" y2="100" stroke="#3a3a3e" stroke-width="1"/>
  <line x1="45" y1="150" x2="115" y2="130" stroke="#3a3a3e" stroke-width="1"/>
  <!-- Right side connections -->
  <line x1="285" y1="70" x2="360" y2="50" stroke="#3a3a3e" stroke-width="1"/>
  <line x1="285" y1="100" x2="360" y2="100" stroke="#3a3a3e" stroke-width="1"/>
  <line x1="285" y1="130" x2="360" y2="150" stroke="#3a3a3e" stroke-width="1"/>
  <line x1="285" y1="70" x2="360" y2="100" stroke="#3a3a3e" stroke-width="1"/>
  <line x1="285" y1="130" x2="360" y2="100" stroke="#3a3a3e" stroke-width="1"/>
  <!-- Mid nodes -->
  <circle cx="120" cy="70" r="5" fill="none" stroke="#4a4a4f" stroke-width="1.5"/>
  <circle cx="120" cy="100" r="5" fill="none" stroke="#4a4a4f" stroke-width="1.5"/>
  <circle cx="120" cy="130" r="5" fill="none" stroke="#4a4a4f" stroke-width="1.5"/>
  <circle cx="280" cy="70" r="5" fill="none" stroke="#4a4a4f" stroke-width="1.5"/>
  <circle cx="280" cy="100" r="5" fill="none" stroke="#4a4a4f" stroke-width="1.5"/>
  <circle cx="280" cy="130" r="5" fill="none" stroke="#4a4a4f" stroke-width="1.5"/>
  <!-- Right layer -->
  <circle cx="360" cy="50" r="5" fill="none" stroke="#4a4a4f" stroke-width="1.5"/>
  <circle cx="360" cy="100" r="5" fill="none" stroke="#4a4a4f" stroke-width="1.5"/>
  <circle cx="360" cy="150" r="5" fill="none" stroke="#4a4a4f" stroke-width="1.5"/>

  <!-- Robot head main -->
  <rect x="148" y="50" width="104" height="90" rx="14" fill="#1d1d1f"/>
  <!-- Robot head highlight -->
  <rect x="148" y="50" width="104" height="30" rx="14" fill="#252527"/>
  <rect x="148" y="72" width="104" height="8" fill="#252527"/>
  <!-- Antenna -->
  <line x1="200" y1="50" x2="200" y2="32" stroke="#6e6e73" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="200" cy="28" r="5" fill="#3a3a3c"/>
  <circle cx="200" cy="28" r="2.5" fill="#aeaeb2"/>
  <!-- Side ear connectors -->
  <rect x="132" y="82" width="16" height="24" rx="4" fill="#252527"/>
  <rect x="252" y="82" width="16" height="24" rx="4" fill="#252527"/>
  <circle cx="140" cy="94" r="4" fill="#3a3a3c"/>
  <circle cx="260" cy="94" r="4" fill="#3a3a3c"/>
  <!-- Eyes visor -->
  <rect x="160" y="72" width="80" height="24" rx="6" fill="#3a3a3c"/>
  <!-- Left eye glow -->
  <rect x="166" y="78" width="28" height="12" rx="4" fill="#111113"/>
  <rect x="170" y="80" width="20" height="8" rx="3" fill="#6e6e73" opacity="0.8"/>
  <circle cx="180" cy="84" r="3" fill="white" opacity="0.9"/>
  <circle cx="178" cy="82" r="1.2" fill="white"/>
  <!-- Right eye glow -->
  <rect x="206" y="78" width="28" height="12" rx="4" fill="#111113"/>
  <rect x="210" y="80" width="20" height="8" rx="3" fill="#6e6e73" opacity="0.8"/>
  <circle cx="220" cy="84" r="3" fill="white" opacity="0.9"/>
  <circle cx="218" cy="82" r="1.2" fill="white"/>
  <!-- Mouth panel -->
  <rect x="168" y="106" width="64" height="16" rx="4" fill="#252527"/>
  <rect x="172" y="109" width="8" height="10" rx="2" fill="#aeaeb2" opacity="0.4"/>
  <rect x="184" y="109" width="8" height="10" rx="2" fill="#aeaeb2" opacity="0.7"/>
  <rect x="196" y="109" width="8" height="10" rx="2" fill="#aeaeb2" opacity="0.4"/>
  <rect x="208" y="109" width="8" height="10" rx="2" fill="#aeaeb2" opacity="0.7"/>
  <rect x="220" y="109" width="8" height="10" rx="2" fill="#aeaeb2" opacity="0.4"/>
  <!-- Chest panel -->
  <rect x="162" y="136" width="76" height="18" rx="5" fill="#252527"/>
  <line x1="170" y1="145" x2="190" y2="145" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="210" cy="145" r="4" fill="none" stroke="#6e6e73" stroke-width="1.5"/>
  <circle cx="222" cy="145" r="3" fill="#3a3a3c"/>
  <circle cx="222" cy="145" r="1.5" fill="#aeaeb2"/>

  <!-- Active connection lines (glowing) -->
  <line x1="45" y1="100" x2="148" y2="94" stroke="#6e6e73" stroke-width="1.5" opacity="0.7"/>
  <line x1="252" y1="94" x2="355" y2="100" stroke="#6e6e73" stroke-width="1.5" opacity="0.7"/>

  <!-- Label -->
  <text x="200" y="178" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#6e6e73" text-anchor="middle" letter-spacing="3">AI WEB APPLICATION</text>
</svg>