<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="60%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#003999"/>
    </linearGradient>
    <radialGradient id="cloudShine" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0071e3" flood-opacity="0.4"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Cloud shadow -->
  <path d="M20 55 Q10 55 10 44 Q10 33 20 32 Q20 19 33 16 Q41 10 51 16 Q59 10 65 18 Q76 18 76 30 Q82 33 82 43 Q82 55 69 55 Z"
        fill="#003999" opacity="0.15" transform="translate(-1 3)"/>
  <!-- Cloud body -->
  <path d="M19 53 Q9 53 9 42 Q9 31 19 30 Q19 17 32 14 Q40 8 50 14 Q58 8 64 16 Q75 16 75 28 Q81 31 81 41 Q81 53 68 53 Z"
        fill="url(#cloudGrad)" filter="url(#s)"/>
  <!-- Cloud shine overlay -->
  <path d="M19 30 Q19 17 32 14 Q37 12 42 13 Q30 18 28 30 Q22 30 19 30 Z" fill="white" opacity="0.2"/>
  <ellipse cx="35" cy="22" rx="10" ry="7" fill="url(#cloudShine)"/>
  <!-- Apple logo (white) -->
  <!-- Leaf -->
  <path d="M44 21 Q47 16 50 18 Q47 21 44 21 Z" fill="white" opacity="0.95"/>
  <!-- Apple body -->
  <path d="M36 27 Q35 23 40 23 Q42 23 43.5 24.5 Q45 23 47 23 Q52 23 52 28 Q56 28 56 35 Q56 44 51 46 Q49 46 47 44 Q45 46 43 46 Q38 46 36 44 Q31 44 31 35 Q31 27 36 27 Z"
        fill="white" opacity="0.95" filter="url(#glow)"/>
  <!-- Apple bite (same color as cloud) -->
  <circle cx="52" cy="26" r="5.5" fill="#3a8ff0"/>
  <!-- Upload arrow -->
  <path d="M44 53 L44 62 L36 62 L40 57 L44 62" fill="none" stroke="white" stroke-width="0" opacity="0"/>
</svg>