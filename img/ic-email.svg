<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2980b9"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#1a6db5"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0071e3" flood-opacity="0.3"/></filter>
  </defs>
  <ellipse cx="40" cy="74" rx="26" ry="4" fill="#0071e3" opacity="0.12"/>
  <!-- Envelope body -->
  <rect x="7" y="22" width="66" height="46" rx="8" fill="url(#envGrad)" filter="url(#s)"/>
  <!-- Inner white paper -->
  <rect x="12" y="28" width="56" height="35" rx="4" fill="white" opacity="0.15"/>
  <!-- Bottom fold lines -->
  <path d="M7 68 L28 50" stroke="white" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
  <path d="M73 68 L52 50" stroke="white" stroke-width="1.2" opacity="0.2" stroke-linecap="round"/>
  <!-- Flap -->
  <path d="M7 27 Q7 22 15 22 L40 44 L65 22 Q73 22 73 27 L40 50 Z" fill="url(#flapGrad)"/>
  <path d="M7 27 L40 50 L73 27" fill="none" stroke="white" stroke-width="0.8" opacity="0.3"/>
  <!-- @ symbol -->
  <circle cx="40" cy="48" r="10" fill="none" stroke="white" stroke-width="2" opacity="0.85"/>
  <circle cx="40" cy="48" r="4.5" fill="none" stroke="white" stroke-width="2" opacity="0.85"/>
  <path d="M50 48 L50 44 Q50 39 45.5 38 L40 38" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <!-- Shine -->
  <path d="M15 26 Q20 22 30 22 L15 36 Z" fill="white" opacity="0.12"/>
</svg>
