<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Circuit board background -->
  <rect x="6" y="6" width="68" height="68" rx="8" fill="#f5f5f7"/>
  <rect x="6" y="6" width="68" height="68" rx="8" fill="none" stroke="#e5e5ea" stroke-width="1.5"/>
  <!-- Circuit traces horizontal -->
  <line x1="6" y1="22" x2="24" y2="22" stroke="#d1d1d6" stroke-width="1.5"/>
  <line x1="56" y1="22" x2="74" y2="22" stroke="#d1d1d6" stroke-width="1.5"/>
  <line x1="6" y1="58" x2="24" y2="58" stroke="#d1d1d6" stroke-width="1.5"/>
  <line x1="56" y1="58" x2="74" y2="58" stroke="#d1d1d6" stroke-width="1.5"/>
  <!-- Circuit traces vertical -->
  <line x1="22" y1="6" x2="22" y2="24" stroke="#d1d1d6" stroke-width="1.5"/>
  <line x1="58" y1="6" x2="58" y2="24" stroke="#d1d1d6" stroke-width="1.5"/>
  <line x1="22" y1="56" x2="22" y2="74" stroke="#d1d1d6" stroke-width="1.5"/>
  <line x1="58" y1="56" x2="58" y2="74" stroke="#d1d1d6" stroke-width="1.5"/>
  <!-- Corner solder pads -->
  <circle cx="22" cy="22" r="4" fill="#aeaeb2"/>
  <circle cx="58" cy="22" r="4" fill="#aeaeb2"/>
  <circle cx="22" cy="58" r="4" fill="#aeaeb2"/>
  <circle cx="58" cy="58" r="4" fill="#aeaeb2"/>
  <!-- Inner traces to center chip -->
  <line x1="26" y1="22" x2="34" y2="22" stroke="#d1d1d6" stroke-width="1.2"/>
  <line x1="46" y1="22" x2="54" y2="22" stroke="#d1d1d6" stroke-width="1.2"/>
  <line x1="26" y1="58" x2="34" y2="58" stroke="#d1d1d6" stroke-width="1.2"/>
  <line x1="46" y1="58" x2="54" y2="58" stroke="#d1d1d6" stroke-width="1.2"/>
  <line x1="22" y1="26" x2="22" y2="34" stroke="#d1d1d6" stroke-width="1.2"/>
  <line x1="22" y1="46" x2="22" y2="54" stroke="#d1d1d6" stroke-width="1.2"/>
  <line x1="58" y1="26" x2="58" y2="34" stroke="#d1d1d6" stroke-width="1.2"/>
  <line x1="58" y1="46" x2="58" y2="54" stroke="#d1d1d6" stroke-width="1.2"/>
  <!-- CPU/Chip body -->
  <rect x="26" y="26" width="28" height="28" rx="4" fill="#1d1d1f"/>
  <!-- Chip pins top/bottom -->
  <rect x="30" y="22" width="3" height="4" rx="1" fill="#6e6e73"/>
  <rect x="37" y="22" width="3" height="4" rx="1" fill="#6e6e73"/>
  <rect x="44" y="22" width="3" height="4" rx="1" fill="#6e6e73"/>
  <rect x="30" y="54" width="3" height="4" rx="1" fill="#6e6e73"/>
  <rect x="37" y="54" width="3" height="4" rx="1" fill="#6e6e73"/>
  <rect x="44" y="54" width="3" height="4" rx="1" fill="#6e6e73"/>
  <!-- Chip pins left/right -->
  <rect x="22" y="30" width="4" height="3" rx="1" fill="#6e6e73"/>
  <rect x="22" y="37" width="4" height="3" rx="1" fill="#6e6e73"/>
  <rect x="22" y="44" width="4" height="3" rx="1" fill="#6e6e73"/>
  <rect x="54" y="30" width="4" height="3" rx="1" fill="#6e6e73"/>
  <rect x="54" y="37" width="4" height="3" rx="1" fill="#6e6e73"/>
  <rect x="54" y="44" width="4" height="3" rx="1" fill="#6e6e73"/>
  <!-- Chip label -->
  <rect x="30" y="30" width="20" height="20" rx="2" fill="#252527"/>
  <!-- IT text -->
  <line x1="36" y1="35" x2="36" y2="45" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="35" x2="38" y2="35" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 35 L40 45 L44 45 Q46 45 46 42 Q46 39 44 39 L40 39" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>