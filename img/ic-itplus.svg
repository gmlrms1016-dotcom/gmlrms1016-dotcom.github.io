<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4f8"/>
    </linearGradient>
    <linearGradient id="barA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D058"/><stop offset="100%" stop-color="#28A745"/>
    </linearGradient>
    <linearGradient id="barB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5AC8FA"/><stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
    <linearGradient id="barC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9500"/><stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.18"/></filter>
  </defs>
  <rect x="10" y="12" width="60" height="66" rx="7" fill="#dce8d4" filter="url(#s)"/>
  <rect x="8" y="10" width="60" height="66" rx="7" fill="url(#sheetGrad)"/>
  <!-- Green header -->
  <rect x="8" y="10" width="60" height="14" rx="7" fill="#1D6F42"/>
  <rect x="8" y="17" width="60" height="7" fill="#1D6F42"/>
  <rect x="14" y="14" width="14" height="3" rx="1.5" fill="white" opacity="0.7"/>
  <rect x="32" y="14" width="10" height="3" rx="1.5" fill="white" opacity="0.7"/>
  <rect x="46" y="14" width="10" height="3" rx="1.5" fill="white" opacity="0.7"/>
  <!-- Grid -->
  <line x1="8"  y1="31" x2="68" y2="31" stroke="#c8d8c8" stroke-width="1"/>
  <line x1="8"  y1="41" x2="68" y2="41" stroke="#c8d8c8" stroke-width="1"/>
  <line x1="8"  y1="51" x2="68" y2="51" stroke="#c8d8c8" stroke-width="1"/>
  <line x1="30" y1="24" x2="30" y2="76" stroke="#c8d8c8" stroke-width="1"/>
  <line x1="50" y1="24" x2="50" y2="76" stroke="#c8d8c8" stroke-width="1"/>
  <!-- Row data -->
  <rect x="14" y="26" width="12" height="3" rx="1.5" fill="#555" opacity="0.6"/>
  <rect x="34" y="26" width="7"  height="3" rx="1.5" fill="#34C759" opacity="0.9"/>
  <rect x="54" y="26" width="7"  height="3" rx="1.5" fill="#0071e3" opacity="0.9"/>
  <rect x="14" y="36" width="12" height="3" rx="1.5" fill="#555" opacity="0.6"/>
  <rect x="34" y="36" width="7"  height="3" rx="1.5" fill="#FF9500" opacity="0.9"/>
  <rect x="54" y="36" width="7"  height="3" rx="1.5" fill="#34C759" opacity="0.9"/>
  <rect x="14" y="46" width="12" height="3" rx="1.5" fill="#555" opacity="0.6"/>
  <rect x="34" y="46" width="7"  height="3" rx="1.5" fill="#0071e3" opacity="0.9"/>
  <rect x="54" y="46" width="7"  height="3" rx="1.5" fill="#FF9500" opacity="0.9"/>
  <!-- Bar chart -->
  <rect x="14" y="57" width="8"  height="16" rx="2" fill="url(#barA)"/>
  <rect x="26" y="63" width="8"  height="10" rx="2" fill="url(#barB)"/>
  <rect x="38" y="60" width="8"  height="13" rx="2" fill="url(#barC)"/>
  <rect x="50" y="55" width="8"  height="18" rx="2" fill="url(#barA)"/>
  <!-- Trend line -->
  <polyline points="18,62 30,66 42,63 54,59" fill="none" stroke="#FF2D55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="18" cy="62" r="2" fill="#FF2D55"/>
  <circle cx="30" cy="66" r="2" fill="#FF2D55"/>
  <circle cx="42" cy="63" r="2" fill="#FF2D55"/>
  <circle cx="54" cy="59" r="2" fill="#FF2D55"/>
</svg>