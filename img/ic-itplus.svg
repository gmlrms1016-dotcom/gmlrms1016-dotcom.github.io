<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Spreadsheet shadow -->
  <rect x="10" y="12" width="60" height="58" rx="6" fill="#1d1d1f" opacity="0.08" transform="translate(0 3)"/>
  <!-- Spreadsheet base -->
  <rect x="10" y="12" width="60" height="58" rx="6" fill="#f5f5f7"/>
  <rect x="10" y="12" width="60" height="58" rx="6" fill="none" stroke="#e5e5ea" stroke-width="1.5"/>
  <!-- Header row -->
  <rect x="10" y="12" width="60" height="14" rx="6" fill="#1d1d1f"/>
  <rect x="10" y="20" width="60" height="6" fill="#1d1d1f"/>
  <!-- Header text lines -->
  <line x1="20" y1="19" x2="34" y2="19" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="20" y1="23" x2="28" y2="23" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <!-- Grid lines vertical -->
  <line x1="30" y1="26" x2="30" y2="70" stroke="#e5e5ea" stroke-width="1"/>
  <line x1="46" y1="26" x2="46" y2="70" stroke="#e5e5ea" stroke-width="1"/>
  <line x1="62" y1="26" x2="62" y2="70" stroke="#e5e5ea" stroke-width="1"/>
  <!-- Grid lines horizontal -->
  <line x1="10" y1="34" x2="70" y2="34" stroke="#e5e5ea" stroke-width="1"/>
  <line x1="10" y1="44" x2="70" y2="44" stroke="#e5e5ea" stroke-width="1"/>
  <line x1="10" y1="54" x2="70" y2="54" stroke="#e5e5ea" stroke-width="1"/>
  <line x1="10" y1="62" x2="70" y2="62" stroke="#e5e5ea" stroke-width="1"/>
  <!-- Row labels -->
  <rect x="13" y="28" width="12" height="4" rx="1.5" fill="#aeaeb2"/>
  <rect x="13" y="38" width="12" height="4" rx="1.5" fill="#aeaeb2"/>
  <rect x="13" y="48" width="12" height="4" rx="1.5" fill="#aeaeb2"/>
  <rect x="13" y="58" width="12" height="4" rx="1.5" fill="#aeaeb2"/>
  <!-- Bar chart bars (right side) -->
  <rect x="34" y="54" width="8" height="14" rx="2" fill="#6e6e73"/>
  <rect x="44" y="46" width="8" height="22" rx="2" fill="#3a3a3c"/>
  <rect x="54" y="38" width="8" height="30" rx="2" fill="#1d1d1f"/>
  <!-- Trend line -->
  <polyline points="38,54 48,45 58,37" fill="none" stroke="#6e6e73" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3,2"/>
</svg>